<!-- FileInput — requires Veil UI tokens and Tailwind v4. -->
<div data-slot="file-input" class="flex w-full max-w-sm flex-col gap-1.5">
  <label for="file-input-resume" class="text-sm font-medium leading-none">
    Resume
  </label>
  <input
    id="file-input-resume"
    type="file"
    accept=".pdf,.doc,.docx"
    aria-describedby="file-input-resume-hint"
    class="block w-full cursor-pointer rounded-md border border-input bg-transparent text-sm text-muted-foreground shadow-xs outline-none transition-colors file:mr-3 file:h-9 file:border-0 file:border-r file:border-solid file:border-input file:bg-secondary file:px-3 file:text-sm file:font-medium file:text-secondary-foreground hover:file:bg-secondary/80 focus-visible:border-ring focus-visible:ring-[3px] focus-visible:ring-ring/50 disabled:cursor-not-allowed disabled:opacity-50 aria-invalid:border-destructive aria-invalid:ring-destructive/20"
  />
  <p id="file-input-resume-hint" class="text-sm text-muted-foreground">
    PDF or Word document, up to 5 MB.
  </p>

  <label
    for="file-input-avatar"
    class="mt-4 text-sm font-medium leading-none"
  >
    Avatar
  </label>
  <input
    id="file-input-avatar"
    type="file"
    accept="image/*"
    aria-invalid="true"
    aria-describedby="file-input-avatar-error"
    class="block w-full cursor-pointer rounded-md border border-input bg-transparent text-sm text-muted-foreground shadow-xs outline-none transition-colors file:mr-3 file:h-9 file:border-0 file:border-r file:border-solid file:border-input file:bg-secondary file:px-3 file:text-sm file:font-medium file:text-secondary-foreground hover:file:bg-secondary/80 focus-visible:border-ring focus-visible:ring-[3px] focus-visible:ring-ring/50 aria-invalid:border-destructive aria-invalid:ring-destructive/20"
  />
  <p id="file-input-avatar-error" role="alert" class="text-sm text-destructive">
    Please choose an image smaller than 2 MB.
  </p>
</div>
