<!-- Mobile Share Sheet — requires Veil UI tokens and Tailwind v4. -->
<div class="flex min-h-48 items-center justify-center p-6">
  <button
    type="button"
    data-share-sheet-open
    class="inline-flex h-9 items-center justify-center gap-2 rounded-md border border-input bg-background px-4 text-sm font-medium outline-none transition-colors hover:bg-accent hover:text-accent-foreground focus-visible:ring-[3px] focus-visible:ring-ring/50"
  >
    Share
  </button>

  <dialog
    id="mobile-share-sheet"
    data-share-sheet
    aria-labelledby="share-sheet-title"
    class="fixed inset-x-0 bottom-0 top-auto m-0 max-h-[85vh] w-full max-w-none overflow-y-auto rounded-t-xl border-t bg-background px-6 pt-3 pb-6 text-foreground shadow-lg backdrop:bg-black/50"
  >
    <div aria-hidden="true" class="mx-auto mb-3 h-1.5 w-10 rounded-full bg-muted"></div>

    <div class="flex flex-col gap-4">
      <div class="flex flex-col gap-1.5 pr-8">
        <h2 id="share-sheet-title" class="text-lg font-semibold">Share guide</h2>
        <p class="truncate text-sm text-muted-foreground">
          https://veil-ui.dev/docs/theming
        </p>
      </div>

      <ul class="grid grid-cols-4 gap-3" aria-label="Share targets">
        <li>
          <a
            href="mailto:?subject=Shared%20link"
            data-share-sheet-close
            class="flex w-full flex-col items-center gap-1.5 rounded-lg py-2 text-center outline-none transition-colors hover:bg-accent focus-visible:ring-2 focus-visible:ring-ring"
          >
            <span class="flex size-12 items-center justify-center rounded-full bg-muted text-muted-foreground">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="size-5"
                aria-hidden="true"
              >
                <rect width="20" height="16" x="2" y="4" rx="2" />
                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
              </svg>
            </span>
            <span class="text-[11px] leading-tight">Email</span>
          </a>
        </li>
        <li>
          <a
            href="#"
            data-share-sheet-close
            class="flex w-full flex-col items-center gap-1.5 rounded-lg py-2 text-center outline-none transition-colors hover:bg-accent focus-visible:ring-2 focus-visible:ring-ring"
          >
            <span class="flex size-12 items-center justify-center rounded-full bg-muted text-muted-foreground">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="size-5"
                aria-hidden="true"
              >
                <path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z" />
              </svg>
            </span>
            <span class="text-[11px] leading-tight">Message</span>
          </a>
        </li>
        <li>
          <a
            href="#"
            data-share-sheet-close
            class="flex w-full flex-col items-center gap-1.5 rounded-lg py-2 text-center outline-none transition-colors hover:bg-accent focus-visible:ring-2 focus-visible:ring-ring"
          >
            <span class="flex size-12 items-center justify-center rounded-full bg-muted text-muted-foreground">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="size-5"
                aria-hidden="true"
              >
                <path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z" />
                <path d="m21.854 2.147-10.94 10.939" />
              </svg>
            </span>
            <span class="text-[11px] leading-tight">Send</span>
          </a>
        </li>
        <li>
          <button
            type="button"
            data-share-copy
            class="flex w-full flex-col items-center gap-1.5 rounded-lg py-2 text-center outline-none transition-colors hover:bg-accent focus-visible:ring-2 focus-visible:ring-ring"
          >
            <span class="flex size-12 items-center justify-center rounded-full bg-muted text-muted-foreground">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="size-5"
                aria-hidden="true"
              >
                <path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7" />
                <path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7" />
              </svg>
            </span>
            <span data-share-copy-label class="text-[11px] leading-tight">Copy link</span>
          </button>
        </li>
      </ul>
    </div>

    <button
      type="button"
      data-share-sheet-close
      aria-label="Close share sheet"
      class="absolute top-4 right-4 rounded-sm p-1 text-muted-foreground opacity-70 transition-opacity hover:opacity-100 focus-visible:ring-2 focus-visible:ring-ring"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        class="size-4"
        aria-hidden="true"
      >
        <path d="M18 6 6 18M6 6l12 12" />
      </svg>
    </button>
  </dialog>
</div>
