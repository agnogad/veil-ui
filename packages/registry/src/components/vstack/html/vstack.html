<!-- VStack — requires Veil UI tokens and Tailwind v4. -->
<div class="flex w-full max-w-sm flex-col gap-4">
  <div class="flex flex-col gap-1">
    <label for="vstack-email" class="text-sm font-medium leading-none">Email</label>
    <input id="vstack-email" type="email" placeholder="you@example.com" class="flex h-9 w-full rounded-md border border-input bg-background px-3 py-1 text-sm outline-none placeholder:text-muted-foreground focus-visible:border-ring focus-visible:ring-[3px] focus-visible:ring-ring/50" />
  </div>
  <div class="flex flex-col gap-1">
    <label for="vstack-name" class="text-sm font-medium leading-none">Name</label>
    <input id="vstack-name" type="text" placeholder="Ada Lovelace" class="flex h-9 w-full rounded-md border border-input bg-background px-3 py-1 text-sm outline-none placeholder:text-muted-foreground focus-visible:border-ring focus-visible:ring-[3px] focus-visible:ring-ring/50" />
  </div>
</div>
