<!-- Hamburger Menu — requires Veil UI tokens and Tailwind v4. -->
<!-- Pair with hamburger-menu.js to toggle the open state. -->
<button
  type="button"
  data-hamburger-menu
  data-state="closed"
  aria-label="Toggle navigation"
  aria-expanded="false"
  class="group inline-flex size-9 flex-col items-center justify-center gap-1.5 rounded-md border transition-colors hover:bg-accent focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring"
>
  <span
    aria-hidden="true"
    class="h-px w-4 bg-foreground transition-transform group-data-[state=open]:translate-y-[7px] group-data-[state=open]:rotate-45"
  ></span>
  <span
    aria-hidden="true"
    class="h-px w-4 bg-foreground transition-transform group-data-[state=open]:opacity-0"
  ></span>
  <span
    aria-hidden="true"
    class="h-px w-4 bg-foreground transition-transform group-data-[state=open]:-translate-y-[7px] group-data-[state=open]:-rotate-45"
  ></span>
</button>
