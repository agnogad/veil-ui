<!-- Mobile Dialog — requires Veil UI tokens and Tailwind v4. -->
<div class="flex min-h-48 items-center justify-center p-6">
  <button
    type="button"
    data-mobile-dialog-open
    class="inline-flex h-9 items-center justify-center rounded-md border border-input bg-background px-4 text-sm font-medium outline-none transition-colors hover:bg-accent hover:text-accent-foreground focus-visible:ring-[3px] focus-visible:ring-ring/50"
  >
    Rename project
  </button>

  <dialog
    id="mobile-dialog"
    data-mobile-dialog
    aria-labelledby="mobile-dialog-title"
    class="m-auto w-[calc(100%-2rem)] max-w-sm rounded-lg border bg-background p-6 text-foreground shadow-lg backdrop:bg-black/50"
  >
    <div class="grid gap-4">
      <div class="flex flex-col gap-1.5 text-left">
        <h2 id="mobile-dialog-title" class="text-lg font-semibold leading-none">
          Rename project
        </h2>
        <p class="text-sm text-muted-foreground">
          Pick a short, recognizable name.
        </p>
      </div>

      <div class="grid gap-2">
        <label for="mobile-dialog-name" class="text-sm font-medium leading-none">
          Project name
        </label>
        <input
          id="mobile-dialog-name"
          type="text"
          value="Acme dashboard"
          class="h-9 w-full rounded-md border border-input bg-transparent px-3 py-1 text-sm shadow-xs outline-none placeholder:text-muted-foreground focus-visible:border-ring focus-visible:ring-[3px] focus-visible:ring-ring/50"
        />
      </div>

      <div class="flex flex-col-reverse gap-2 sm:flex-row sm:justify-end">
        <button
          type="button"
          data-mobile-dialog-close
          class="inline-flex h-9 items-center justify-center rounded-md border border-input bg-background px-4 text-sm font-medium transition-colors hover:bg-accent hover:text-accent-foreground"
        >
          Cancel
        </button>
        <button
          type="button"
          data-mobile-dialog-close
          class="inline-flex h-9 items-center justify-center rounded-md bg-primary px-4 text-sm font-medium text-primary-foreground transition-colors hover:bg-primary/90"
        >
          Save
        </button>
      </div>
    </div>
  </dialog>
</div>
