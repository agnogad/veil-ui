<!-- Select — requires Veil UI tokens and Tailwind v4. -->
<div class="grid w-full max-w-xs gap-2">
  <label for="fruit" class="text-sm font-medium leading-none">Favorite fruit</label>
  <div class="relative">
    <select
      id="fruit"
      class="h-9 w-full appearance-none rounded-md border border-input bg-transparent px-3 pr-8 text-sm shadow-xs outline-none transition-[color,box-shadow,border-color] focus-visible:border-ring focus-visible:ring-[3px] focus-visible:ring-ring/50 disabled:cursor-not-allowed disabled:opacity-50"
    >
      <optgroup label="Citrus">
        <option value="orange">Orange</option>
        <option value="lemon">Lemon</option>
      </optgroup>
      <optgroup label="Orchard">
        <option value="apple" selected>Apple</option>
        <option value="pear">Pear</option>
      </optgroup>
    </select>
    <svg
      class="pointer-events-none absolute right-3 top-1/2 size-4 -translate-y-1/2 opacity-50"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      aria-hidden="true"
    >
      <path d="m6 9 6 6 6-6" />
    </svg>
  </div>
  <p class="text-xs text-muted-foreground">
    Native select with optgroups — fully keyboard accessible.
  </p>
</div>
