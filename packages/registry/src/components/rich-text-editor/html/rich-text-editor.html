<!-- Rich Text Editor — requires Veil UI tokens, Tailwind v4 and the sibling rich-text-editor.js script. -->
<div class="max-w-xl">
  <div data-slot="rich-text" class="overflow-hidden rounded-md border bg-background focus-within:ring-2 focus-within:ring-ring">
    <div role="toolbar" aria-label="Text formatting" class="flex items-center gap-1 border-b p-1">
      <button type="button" data-command="bold" aria-label="Bold" class="rounded-sm p-1.5 text-muted-foreground transition-colors hover:bg-accent hover:text-accent-foreground">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-4" aria-hidden="true"><path d="M6 12h9a4 4 0 0 1 0 8H7a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h7a4 4 0 0 1 0 8"></path></svg>
      </button>
      <button type="button" data-command="italic" aria-label="Italic" class="rounded-sm p-1.5 text-muted-foreground transition-colors hover:bg-accent hover:text-accent-foreground">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-4" aria-hidden="true"><line x1="19" x2="10" y1="4" y2="4"></line><line x1="14" x2="5" y1="20" y2="20"></line><line x1="15" x2="9" y1="4" y2="20"></line></svg>
      </button>
      <button type="button" data-command="underline" aria-label="Underline" class="rounded-sm p-1.5 text-muted-foreground transition-colors hover:bg-accent hover:text-accent-foreground">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-4" aria-hidden="true"><path d="M6 4v6a6 6 0 0 0 12 0V4"></path><line x1="4" x2="20" y1="20" y2="20"></line></svg>
      </button>
    </div>
    <div class="relative">
      <span data-placeholder class="pointer-events-none absolute left-3 top-2 hidden text-sm text-muted-foreground">Write something…</span>
      <div
        role="textbox"
        aria-label="Rich text editor"
        aria-multiline="true"
        contenteditable="true"
        class="min-h-24 px-3 py-2 text-sm leading-relaxed outline-none"
      ><p>Tell us about <strong>your project</strong>.</p></div>
    </div>
  </div>
</div>
