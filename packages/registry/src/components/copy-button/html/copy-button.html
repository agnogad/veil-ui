<!-- Copy Button — requires Veil UI tokens and Tailwind v4. -->
<div class="flex w-full max-w-sm items-center justify-between gap-2 rounded-md border px-3 py-2">
  <code class="text-sm">npx veil-ui@latest add button</code>
  <button
    type="button"
    data-copy-button
    data-copy-value="npx veil-ui@latest add button"
    data-copy-label="Copy"
    data-copied-label="Copied"
    aria-label="Copy"
    class="inline-flex size-9 shrink-0 items-center justify-center rounded-md outline-none transition-colors hover:bg-accent hover:text-accent-foreground focus-visible:ring-[3px] focus-visible:ring-ring/50"
  >
    <svg data-copy-icon class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <rect width="14" height="14" x="8" y="8" rx="2" ry="2" />
      <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" />
    </svg>
    <svg data-check-icon class="hidden size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <path d="M20 6 9 17l-5-5" />
    </svg>
  </button>
  <span data-copy-status aria-live="polite" class="sr-only"></span>
</div>
