<!-- Chart — requires Veil UI tokens and Tailwind v4. -->
<div data-slot="chart" class="w-full max-w-xl" style="height: 300px">
  <svg viewBox="0 0 600 300" class="size-full" role="img" aria-label="Weekly desktop and mobile sessions">
    <title>Weekly desktop and mobile sessions</title>
    <g stroke="var(--border)" stroke-dasharray="3 3">
      <line x1="0" y1="20" x2="600" y2="20" />
      <line x1="0" y1="90" x2="600" y2="90" />
      <line x1="0" y1="160" x2="600" y2="160" />
      <line x1="0" y1="230" x2="600" y2="230" />
    </g>
    <g>
      <rect x="18" y="140" width="56" height="90" rx="4" fill="var(--chart-1)" />
      <rect x="82" y="120" width="56" height="110" rx="4" fill="var(--chart-2)" />
      <rect x="138" y="160" width="56" height="70" rx="4" fill="var(--chart-1)" />
      <rect x="202" y="132" width="56" height="98" rx="4" fill="var(--chart-2)" />
      <rect x="258" y="150" width="56" height="80" rx="4" fill="var(--chart-1)" />
      <rect x="322" y="112" width="56" height="118" rx="4" fill="var(--chart-2)" />
      <rect x="378" y="170" width="56" height="60" rx="4" fill="var(--chart-1)" />
      <rect x="442" y="148" width="56" height="82" rx="4" fill="var(--chart-2)" />
    </g>
    <g class="fill-muted-foreground" font-size="12">
      <text x="46" y="252" text-anchor="middle">Mon</text>
      <text x="166" y="252" text-anchor="middle">Tue</text>
      <text x="286" y="252" text-anchor="middle">Wed</text>
      <text x="406" y="252" text-anchor="middle">Thu</text>
      <text x="526" y="252" text-anchor="middle">Fri</text>
    </g>
  </svg>
</div>

<ul class="mt-3 flex flex-wrap items-center gap-x-4 gap-y-1 text-xs">
  <li class="flex items-center gap-1.5">
    <span class="size-2 rounded-[2px]" style="background-color: var(--chart-1)" aria-hidden="true"></span>
    <span class="text-muted-foreground">Desktop</span>
  </li>
  <li class="flex items-center gap-1.5">
    <span class="size-2 rounded-[2px]" style="background-color: var(--chart-2)" aria-hidden="true"></span>
    <span class="text-muted-foreground">Mobile</span>
  </li>
</ul>
