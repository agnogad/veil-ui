<!-- Textarea — requires Veil UI tokens and Tailwind v4. -->
<div class="grid max-w-sm gap-2">
  <label for="message-textarea" class="text-sm font-medium leading-none">Message</label>
  <textarea
    id="message-textarea"
    rows="4"
    placeholder="Tell us what you need…"
    class="flex min-h-16 w-full rounded-md border border-input bg-transparent px-3 py-2 text-sm shadow-xs outline-none transition-[color,box-shadow,border-color] placeholder:text-muted-foreground focus-visible:border-ring focus-visible:ring-[3px] focus-visible:ring-ring/50 disabled:cursor-not-allowed disabled:opacity-50 field-sizing-content dark:bg-input/30"
  ></textarea>
  <p class="text-xs text-muted-foreground">Markdown is supported.</p>
</div>
