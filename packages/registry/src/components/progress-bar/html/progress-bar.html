<!-- Progress bar — requires Veil UI tokens and Tailwind v4. -->
<div class="grid w-full max-w-sm gap-2">
  <div class="flex items-center justify-between text-sm">
    <span class="font-medium">Uploading assets</span>
    <span class="text-muted-foreground">72%</span>
  </div>
  <div
    role="progressbar"
    aria-label="Uploading assets"
    aria-valuemin="0"
    aria-valuemax="100"
    aria-valuenow="72"
    class="relative h-2 w-full overflow-hidden rounded-full bg-primary/15"
  >
    <div
      class="h-full w-full flex-1 rounded-full bg-primary transition-transform duration-300 motion-reduce:transition-none"
      style="transform: translateX(-28%)"
    ></div>
  </div>
</div>
