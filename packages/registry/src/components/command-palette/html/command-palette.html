<!-- Command Palette — requires Veil UI tokens and Tailwind v4. -->
<button
  type="button"
  data-palette-open="command-palette-dialog"
  aria-keyshortcuts="Meta+K Control+K"
  class="inline-flex h-9 items-center justify-center rounded-md border border-input bg-background px-4 text-sm font-medium hover:bg-accent hover:text-accent-foreground focus-visible:ring-[3px] focus-visible:ring-ring/50"
>
  Press ⌘K
</button>

<dialog
  id="command-palette-dialog"
  aria-labelledby="command-palette-title"
  class="fixed left-1/2 top-24 m-0 w-[min(32rem,90vw)] -translate-x-1/2 overflow-hidden rounded-lg border bg-popover p-0 text-popover-foreground shadow-xl opacity-0 scale-95 transition-[opacity,scale,display,overlay] [transition-behavior:allow-discrete] duration-150 open:scale-100 open:opacity-100 starting:open:opacity-0 backdrop:bg-black/40 backdrop:opacity-0 backdrop:transition-[opacity,display,overlay] backdrop:[transition-behavior:allow-discrete] open:backdrop:opacity-100 starting:open:backdrop:opacity-0"
>
  <h2 id="command-palette-title" class="sr-only">Command menu</h2>
  <p class="sr-only">Search and run a command.</p>

  <div class="flex items-center gap-2 border-b px-3">
    <svg class="size-4 shrink-0 text-muted-foreground" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <circle cx="11" cy="11" r="8" />
      <path d="m21 21-4.3-4.3" />
    </svg>
    <input
      type="text"
      data-palette-input
      role="combobox"
      aria-autocomplete="list"
      aria-expanded="true"
      aria-controls="command-palette-list"
      aria-label="Search commands…"
      placeholder="Search commands…"
      class="h-11 w-full bg-transparent text-sm outline-none placeholder:text-muted-foreground"
    />
    <kbd class="rounded border bg-muted px-1.5 py-0.5 text-[10px] font-medium text-muted-foreground">⌘K</kbd>
  </div>

  <div
    id="command-palette-list"
    role="listbox"
    aria-label="Command palette"
    class="max-h-72 overflow-y-auto p-2"
  >
    <div data-palette-group role="group" aria-label="Navigate">
      <div class="px-2 py-1.5 text-[11px] font-medium uppercase tracking-wider text-muted-foreground">
        Navigate
      </div>
      <button
        type="button"
        role="option"
        data-palette-item
        data-palette-label="Search docs"
        aria-selected="true"
        class="flex w-full cursor-default select-none items-center gap-2 rounded-sm px-2 py-2 text-left text-sm outline-none aria-selected:bg-accent aria-selected:text-accent-foreground"
      >
        Search docs
        <span class="ml-auto text-xs tracking-widest text-muted-foreground">⌘K</span>
      </button>
      <button
        type="button"
        role="option"
        data-palette-item
        data-palette-label="Go to settings"
        aria-selected="false"
        class="flex w-full cursor-default select-none items-center gap-2 rounded-sm px-2 py-2 text-left text-sm outline-none aria-selected:bg-accent aria-selected:text-accent-foreground"
      >
        Go to settings
        <span class="ml-auto text-xs tracking-widest text-muted-foreground">G S</span>
      </button>
    </div>

    <div data-palette-group role="group" aria-label="Actions">
      <div class="px-2 py-1.5 text-[11px] font-medium uppercase tracking-wider text-muted-foreground">
        Actions
      </div>
      <button
        type="button"
        role="option"
        data-palette-item
        data-palette-label="Copy install command"
        aria-selected="false"
        class="flex w-full cursor-default select-none items-center gap-2 rounded-sm px-2 py-2 text-left text-sm outline-none aria-selected:bg-accent aria-selected:text-accent-foreground"
      >
        Copy install command
      </button>
    </div>

    <div
      data-palette-empty
      hidden
      class="py-6 text-center text-sm text-muted-foreground"
    >
      No results found.
    </div>
  </div>
</dialog>
