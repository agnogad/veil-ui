<!-- Mobile Filter Sheet — requires Veil UI tokens and Tailwind v4. -->
<div class="flex min-h-48 items-center justify-center p-6">
  <button
    type="button"
    data-filter-sheet-open
    class="inline-flex h-9 items-center justify-center rounded-md border border-input bg-background px-4 text-sm font-medium outline-none transition-colors hover:bg-accent hover:text-accent-foreground focus-visible:ring-[3px] focus-visible:ring-ring/50"
  >
    Filters
  </button>

  <dialog
    id="mobile-filter-sheet"
    data-filter-sheet
    aria-labelledby="filter-sheet-title"
    class="fixed inset-x-0 bottom-0 top-auto m-0 max-h-[85vh] w-full max-w-none overflow-y-auto rounded-t-xl border-t bg-background px-6 pt-3 pb-6 text-foreground shadow-lg backdrop:bg-black/50"
  >
    <div aria-hidden="true" class="mx-auto mb-3 h-1.5 w-10 rounded-full bg-muted"></div>

    <div class="flex flex-col gap-4">
      <div class="flex flex-col gap-1.5 pr-8">
        <h2 id="filter-sheet-title" class="text-lg font-semibold">Filters</h2>
        <p class="text-sm text-muted-foreground">
          Narrow the results, then apply.
        </p>
      </div>

      <fieldset class="grid gap-2">
        <legend class="text-xs font-medium uppercase tracking-wide text-muted-foreground">
          Category
        </legend>
        <div class="flex flex-wrap gap-2">
          <button
            type="button"
            data-filter-option
            aria-pressed="false"
            class="rounded-full border bg-background px-3 py-1.5 text-xs font-medium outline-none transition-colors hover:bg-accent focus-visible:ring-2 focus-visible:ring-ring aria-pressed:border-primary aria-pressed:bg-primary aria-pressed:text-primary-foreground"
          >
            Design
          </button>
          <button
            type="button"
            data-filter-option
            aria-pressed="false"
            class="rounded-full border bg-background px-3 py-1.5 text-xs font-medium outline-none transition-colors hover:bg-accent focus-visible:ring-2 focus-visible:ring-ring aria-pressed:border-primary aria-pressed:bg-primary aria-pressed:text-primary-foreground"
          >
            Engineering
          </button>
          <button
            type="button"
            data-filter-option
            aria-pressed="false"
            class="rounded-full border bg-background px-3 py-1.5 text-xs font-medium outline-none transition-colors hover:bg-accent focus-visible:ring-2 focus-visible:ring-ring aria-pressed:border-primary aria-pressed:bg-primary aria-pressed:text-primary-foreground"
          >
            Marketing
          </button>
        </div>
      </fieldset>

      <fieldset class="grid gap-2">
        <legend class="text-xs font-medium uppercase tracking-wide text-muted-foreground">
          Price
        </legend>
        <div class="flex flex-wrap gap-2">
          <button
            type="button"
            data-filter-option
            aria-pressed="false"
            class="rounded-full border bg-background px-3 py-1.5 text-xs font-medium outline-none transition-colors hover:bg-accent focus-visible:ring-2 focus-visible:ring-ring aria-pressed:border-primary aria-pressed:bg-primary aria-pressed:text-primary-foreground"
          >
            Free
          </button>
          <button
            type="button"
            data-filter-option
            aria-pressed="false"
            class="rounded-full border bg-background px-3 py-1.5 text-xs font-medium outline-none transition-colors hover:bg-accent focus-visible:ring-2 focus-visible:ring-ring aria-pressed:border-primary aria-pressed:bg-primary aria-pressed:text-primary-foreground"
          >
            Paid
          </button>
        </div>
      </fieldset>

      <div class="mt-auto flex flex-row gap-2">
        <button
          type="button"
          data-filter-reset
          class="inline-flex h-9 flex-1 items-center justify-center rounded-md border border-input bg-background px-4 text-sm font-medium transition-colors hover:bg-accent hover:text-accent-foreground"
        >
          Reset
        </button>
        <button
          type="button"
          data-filter-apply
          data-filter-sheet-close
          class="inline-flex h-9 flex-1 items-center justify-center rounded-md bg-primary px-4 text-sm font-medium text-primary-foreground transition-colors hover:bg-primary/90"
        >
          Apply filters
        </button>
      </div>
    </div>

    <button
      type="button"
      data-filter-sheet-close
      aria-label="Close filter sheet"
      class="absolute top-4 right-4 rounded-sm p-1 text-muted-foreground opacity-70 transition-opacity hover:opacity-100 focus-visible:ring-2 focus-visible:ring-ring"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        class="size-4"
        aria-hidden="true"
      >
        <path d="M18 6 6 18M6 6l12 12" />
      </svg>
    </button>
  </dialog>
</div>
