<!-- Notification Card — requires Veil UI tokens and Tailwind v4. -->
<div class="grid max-w-md gap-3">
  <div
    data-slot="notification-card"
    class="max-w-md rounded-lg border bg-card py-3 text-card-foreground shadow-xs"
  >
    <div class="flex gap-3 px-5">
      <span class="flex size-8 shrink-0 items-center justify-center rounded-full bg-sky-500/10 text-sky-600 dark:text-sky-400">
        <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="12" cy="12" r="10" />
          <path d="M12 16v-4M12 8h.01" />
        </svg>
      </span>
      <div class="min-w-0 flex-1">
        <div class="flex items-start justify-between gap-2">
          <p class="text-sm font-medium">New comment on your pull request</p>
        </div>
        <p class="mt-1 text-sm text-muted-foreground">
          Mira left feedback on the token refactor.
        </p>
        <div class="mt-1 flex items-center gap-3">
          <time class="text-xs text-muted-foreground">5 minutes ago</time>
        </div>
      </div>
    </div>
  </div>

  <div
    data-slot="notification-card"
    data-unread
    class="max-w-md rounded-lg border border-primary/40 bg-primary/5 py-3 text-card-foreground shadow-xs"
  >
    <div class="flex gap-3 px-5">
      <span class="flex size-8 shrink-0 items-center justify-center rounded-full bg-emerald-500/10 text-emerald-600 dark:text-emerald-400">
        <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="12" cy="12" r="10" />
          <path d="m9 12 2 2 4-4" />
        </svg>
      </span>
      <div class="min-w-0 flex-1">
        <div class="flex items-start justify-between gap-2">
          <p class="text-sm font-medium">Deployment succeeded</p>
          <span class="mt-1 size-2 shrink-0 rounded-full bg-primary" aria-label="Unread"></span>
        </div>
        <p class="mt-1 text-sm text-muted-foreground">
          api@2.4.0 is live in eu-central-1.
        </p>
        <div class="mt-1 flex items-center gap-3">
          <time class="text-xs text-muted-foreground">Just now</time>
          <button type="button" class="text-xs font-medium text-muted-foreground underline-offset-4 hover:text-foreground hover:underline">
            View deployment
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
