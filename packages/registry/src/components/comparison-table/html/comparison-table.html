<!-- Comparison table — requires Veil UI tokens and Tailwind v4. -->
<div class="relative w-full overflow-x-auto">
  <table class="w-full caption-bottom text-sm">
    <caption class="mb-3 text-left text-sm font-medium">Plan comparison</caption>
    <thead class="[&_tr]:border-b">
      <tr class="border-b transition-colors hover:bg-muted/50">
        <th scope="col" class="h-10 whitespace-nowrap px-3 text-left align-middle font-medium text-muted-foreground">Feature</th>
        <th scope="col" class="h-10 whitespace-nowrap px-3 text-center align-middle font-medium text-muted-foreground">
          <span class="block font-medium text-foreground">Starter</span>
          <span class="block text-xs font-normal text-muted-foreground">$0</span>
        </th>
        <th scope="col" class="h-10 whitespace-nowrap px-3 text-center align-middle font-medium text-muted-foreground">
          <span class="block font-medium text-foreground">Team</span>
          <span class="block text-xs font-normal text-muted-foreground">$24</span>
        </th>
        <th scope="col" class="h-10 whitespace-nowrap px-3 text-center align-middle font-medium text-muted-foreground">
          <span class="block font-medium text-foreground">Enterprise</span>
          <span class="block text-xs font-normal text-muted-foreground">Custom</span>
        </th>
      </tr>
    </thead>
    <tbody class="[&_tr:last-child]:border-0">
      <tr class="border-b transition-colors hover:bg-muted/50">
        <td class="whitespace-nowrap p-3 align-middle font-medium">Projects</td>
        <td class="whitespace-nowrap p-3 text-center align-middle">3</td>
        <td class="whitespace-nowrap p-3 text-center align-middle">Unlimited</td>
        <td class="whitespace-nowrap p-3 text-center align-middle">Unlimited</td>
      </tr>
      <tr class="border-b transition-colors hover:bg-muted/50">
        <td class="whitespace-nowrap p-3 align-middle font-medium">SSO</td>
        <td class="whitespace-nowrap p-3 text-center align-middle">
          <span class="inline-flex items-center gap-1 text-muted-foreground">
            <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14" /></svg>
            <span class="sr-only">Not included</span>
          </span>
        </td>
        <td class="whitespace-nowrap p-3 text-center align-middle">
          <span class="inline-flex items-center gap-1 text-muted-foreground">
            <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14" /></svg>
            <span class="sr-only">Not included</span>
          </span>
        </td>
        <td class="whitespace-nowrap p-3 text-center align-middle">
          <span class="inline-flex items-center gap-1 text-emerald-600 dark:text-emerald-400">
            <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg>
            <span class="sr-only">Included</span>
          </span>
        </td>
      </tr>
      <tr class="border-b transition-colors hover:bg-muted/50">
        <td class="whitespace-nowrap p-3 align-middle font-medium">Audit log</td>
        <td class="whitespace-nowrap p-3 text-center align-middle">
          <span class="inline-flex items-center gap-1 text-muted-foreground">
            <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14" /></svg>
            <span class="sr-only">Not included</span>
          </span>
        </td>
        <td class="whitespace-nowrap p-3 text-center align-middle">
          <span class="inline-flex items-center gap-1 text-emerald-600 dark:text-emerald-400">
            <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg>
            <span class="sr-only">Included</span>
          </span>
        </td>
        <td class="whitespace-nowrap p-3 text-center align-middle">
          <span class="inline-flex items-center gap-1 text-emerald-600 dark:text-emerald-400">
            <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg>
            <span class="sr-only">Included</span>
          </span>
        </td>
      </tr>
    </tbody>
  </table>
</div>
