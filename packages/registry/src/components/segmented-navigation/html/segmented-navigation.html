<!-- Segmented Navigation — requires Veil UI tokens and Tailwind v4. -->
<!-- Pair with segmented-navigation.js for click and arrow-key selection. -->
<div
  role="tablist"
  aria-label="Segmented navigation"
  data-segmented
  class="inline-flex items-center gap-1 rounded-lg border bg-muted p-1"
>
  <button
    type="button"
    role="tab"
    data-value="day"
    aria-selected="true"
    tabindex="0"
    class="rounded-md px-3 py-1 text-sm font-medium text-muted-foreground transition-colors hover:text-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring aria-[selected=true]:bg-background aria-[selected=true]:text-foreground aria-[selected=true]:shadow-sm"
  >
    Day
  </button>
  <button
    type="button"
    role="tab"
    data-value="week"
    aria-selected="false"
    tabindex="-1"
    class="rounded-md px-3 py-1 text-sm font-medium text-muted-foreground transition-colors hover:text-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring aria-[selected=true]:bg-background aria-[selected=true]:text-foreground aria-[selected=true]:shadow-sm"
  >
    Week
  </button>
  <button
    type="button"
    role="tab"
    data-value="month"
    aria-selected="false"
    tabindex="-1"
    class="rounded-md px-3 py-1 text-sm font-medium text-muted-foreground transition-colors hover:text-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring aria-[selected=true]:bg-background aria-[selected=true]:text-foreground aria-[selected=true]:shadow-sm"
  >
    Month
  </button>
</div>
