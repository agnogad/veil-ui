<!-- StatusBadge — requires Veil UI tokens and Tailwind v4. -->
<div class="flex flex-wrap items-center gap-2">
  <span data-slot="status-badge" data-status="success" class="inline-flex items-center gap-1.5 rounded-full border border-emerald-500/20 bg-emerald-500/10 px-2 py-0.5 text-xs font-medium text-emerald-700 dark:text-emerald-400">
    <span aria-hidden="true" class="size-1.5 rounded-full bg-emerald-500"></span>
    Active
  </span>
  <span data-slot="status-badge" data-status="warning" class="inline-flex items-center gap-1.5 rounded-full border border-amber-500/20 bg-amber-500/10 px-2 py-0.5 text-xs font-medium text-amber-700 dark:text-amber-400">
    <span aria-hidden="true" class="size-1.5 rounded-full bg-amber-500"></span>
    Trial ending
  </span>
  <span data-slot="status-badge" data-status="danger" class="inline-flex items-center gap-1.5 rounded-full border border-red-500/20 bg-red-500/10 px-2 py-0.5 text-xs font-medium text-red-700 dark:text-red-400">
    <span aria-hidden="true" class="size-1.5 rounded-full bg-red-500"></span>
    Failed
  </span>
  <span data-slot="status-badge" data-status="info" class="inline-flex items-center gap-1.5 rounded-full border border-sky-500/20 bg-sky-500/10 px-2 py-0.5 text-xs font-medium text-sky-700 dark:text-sky-400">
    <span aria-hidden="true" class="size-1.5 rounded-full bg-sky-500"></span>
    In review
  </span>
  <span data-slot="status-badge" data-status="neutral" class="inline-flex items-center gap-1.5 rounded-full border border-border bg-muted px-2 py-0.5 text-xs font-medium text-muted-foreground">
    <span aria-hidden="true" class="size-1.5 rounded-full bg-muted-foreground"></span>
    Draft
  </span>
</div>
