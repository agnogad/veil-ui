<!-- Table cell — requires Veil UI tokens and Tailwind v4. -->
<div class="relative w-full overflow-x-auto">

      </tr>

    <tbody class="[&_tr:last-child]:border-0">

        </td>
        <td class="whitespace-nowrap p-3 text-right align-middle tabular-nums">$1,120.00</td>
      </tr>
    </tbody>
  </table>
</div>
