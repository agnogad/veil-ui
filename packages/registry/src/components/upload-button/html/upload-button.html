<!-- Upload Button — requires Veil UI tokens and Tailwind v4. -->
<!-- Pair with upload-button.js to open the file picker and report selections. -->
<div class="grid gap-2">
  <input
    data-upload-input
    type="file"
    accept="image/*"
    multiple
    aria-hidden="true"
    tabindex="-1"
    class="sr-only"
  />
  <button
    type="button"
    data-upload-button
    class="inline-flex h-9 w-fit shrink-0 items-center justify-center gap-2 whitespace-nowrap rounded-md bg-primary px-4 py-2 text-sm font-medium text-primary-foreground outline-none transition-colors hover:bg-primary/90 focus-visible:border-ring focus-visible:ring-[3px] focus-visible:ring-ring/50"
  >
    <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
      <path d="m17 8-5-5-5 5" />
      <path d="M12 3v12" />
    </svg>
    <span data-upload-label>Upload images</span>
  </button>
  <p data-upload-status class="text-xs text-muted-foreground" aria-live="polite"></p>
</div>
