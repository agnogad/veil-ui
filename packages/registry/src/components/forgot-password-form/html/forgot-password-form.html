<!-- Forgot Password Form — requires Veil UI tokens and Tailwind v4. -->
<form data-slot="forgot-password-form" class="grid w-full max-w-sm gap-5 rounded-xl border bg-background p-6">
  <div class="grid gap-1.5">
    <h1 class="text-xl font-semibold tracking-tight">Forgot your password?</h1>
    <p class="text-sm text-muted-foreground">Enter your email and we will send a reset link.</p>
  </div>

  <div class="grid gap-2">
    <label for="forgot-email" class="text-sm font-medium leading-none">Email</label>
    <input
      id="forgot-email"
      type="email"
      autocomplete="email"
      placeholder="you@example.com"
      required
      class="h-9 w-full min-w-0 rounded-md border border-input bg-transparent px-3 py-1 text-sm shadow-xs outline-none transition-[color,box-shadow,border-color] placeholder:text-muted-foreground focus-visible:border-ring focus-visible:ring-[3px] focus-visible:ring-ring/50 dark:bg-input/30"
    />
  </div>

  <button
    type="submit"
    class="inline-flex h-9 w-full items-center justify-center gap-2 rounded-md bg-primary px-4 text-sm font-medium text-primary-foreground transition-colors hover:bg-primary/90 focus-visible:ring-[3px] focus-visible:ring-ring/50"
  >
    Send reset link
  </button>

  <a
    href="#login"
    class="inline-flex items-center justify-center gap-1 text-sm text-muted-foreground underline-offset-4 hover:text-foreground hover:underline"
  >
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-3.5" aria-hidden="true"><path d="m12 19-7-7 7-7" /><path d="M19 12H5" /></svg>
    Back to sign in
  </a>
</form>
