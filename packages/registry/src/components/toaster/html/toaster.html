<!-- Toaster — requires Veil UI tokens and Tailwind v4. -->
<div data-toaster-demo class="flex flex-col gap-3">
  <button
    type="button"
    data-toaster-trigger
    class="inline-flex h-9 w-fit items-center justify-center rounded-md bg-primary px-4 text-sm font-medium text-primary-foreground hover:bg-primary/90"
  >
    Show toast
  </button>

  <div
    data-toaster
    aria-label="Notification"
    class="fixed right-0 bottom-0 z-50 flex max-h-screen w-full flex-col gap-2 p-4 sm:max-w-sm"
  >
    <div
      data-slot="toast"
      data-state="open"
      data-variant="success"
      class="pointer-events-auto relative flex w-full items-start gap-3 rounded-lg border border-emerald-500/30 bg-emerald-500/10 p-4 pr-10 text-sm text-emerald-900 shadow-lg data-[state=closed]:animate-out data-[state=closed]:fade-out-80 data-[state=open]:animate-in data-[state=open]:slide-in-from-bottom-full dark:text-emerald-100"
    >
      <div class="grid flex-1 gap-1">
        <p class="font-medium">Saved</p>
        <p class="opacity-90">Everything is up to date.</p>
      </div>
      <button
        type="button"
        data-toast-close
        aria-label="Dismiss notification"
        class="absolute top-2 right-2 inline-flex size-8 items-center justify-center rounded-md hover:bg-accent hover:text-accent-foreground focus-visible:ring-[3px] focus-visible:ring-ring/50"
      >
        <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M18 6 6 18M6 6l12 12" />
        </svg>
      </button>
    </div>

    <template id="toaster-template">
      <div
        data-slot="toast"
        data-state="open"
        class="pointer-events-auto relative flex w-full items-start gap-3 rounded-lg border border-border bg-background p-4 pr-10 text-sm text-foreground shadow-lg data-[state=closed]:animate-out data-[state=closed]:fade-out-80 data-[state=open]:animate-in data-[state=open]:slide-in-from-bottom-full"
      >
        <div class="grid flex-1 gap-1">
          <p class="font-medium">Draft saved</p>
          <p class="opacity-90">You can publish whenever you are ready.</p>
        </div>
        <button
          type="button"
          data-toast-close
          aria-label="Dismiss notification"
          class="absolute top-2 right-2 inline-flex size-8 items-center justify-center rounded-md hover:bg-accent hover:text-accent-foreground focus-visible:ring-[3px] focus-visible:ring-ring/50"
        >
          <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M18 6 6 18M6 6l12 12" />
          </svg>
        </button>
      </div>
    </template>
  </div>
</div>
