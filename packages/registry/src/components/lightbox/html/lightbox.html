<!-- Lightbox — requires Veil UI tokens and Tailwind v4. -->
<div class="flex min-h-48 items-center justify-center p-6">
  <button
    type="button"
    data-lightbox-open
    class="inline-flex h-9 items-center justify-center rounded-md border border-input bg-background px-4 text-sm font-medium outline-none transition-colors hover:bg-accent hover:text-accent-foreground focus-visible:ring-[3px] focus-visible:ring-ring/50"
  >
    View gallery
  </button>

  <dialog
    id="lightbox"
    data-lightbox
    aria-label="Image viewer"
    class="fixed inset-0 m-0 h-full max-h-none w-full max-w-none bg-black/90 p-6 text-white backdrop:bg-black/90"
  >
    <div class="flex h-full flex-col items-center justify-center gap-4">
      <img
        data-lightbox-image
        src="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='800'%20height='500'%3E%3Cdefs%3E%3ClinearGradient%20id='g'%20x1='0'%20y1='0'%20x2='1'%20y2='1'%3E%3Cstop%20offset='0'%20stop-color='%23f97316'/%3E%3Cstop%20offset='1'%20stop-color='%23f43f5e'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width='800'%20height='500'%20fill='url(%23g)'/%3E%3Ctext%20x='50%25'%20y='50%25'%20fill='white'%20font-family='sans-serif'%20font-size='48'%20text-anchor='middle'%3ESunrise%3C/text%3E%3C/svg%3E"
        alt="Sunrise placeholder"
        class="max-h-[80vh] max-w-full rounded-md object-contain"
      />

      <div class="flex items-center gap-3">
        <button
          type="button"
          data-lightbox-prev
          aria-label="Previous image"
          class="inline-flex size-9 items-center justify-center rounded-full border border-white/30 bg-white/10 text-white outline-none transition-colors hover:bg-white/20 focus-visible:ring-2 focus-visible:ring-white/60"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="size-4"
            aria-hidden="true"
          >
            <path d="m15 18-6-6 6-6" />
          </svg>
        </button>
        <p
          data-lightbox-counter
          aria-live="polite"
          class="min-w-16 text-center text-sm tabular-nums text-white/80"
        >
          1 / 3
        </p>
        <button
          type="button"
          data-lightbox-next
          aria-label="Next image"
          class="inline-flex size-9 items-center justify-center rounded-full border border-white/30 bg-white/10 text-white outline-none transition-colors hover:bg-white/20 focus-visible:ring-2 focus-visible:ring-white/60"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="size-4"
            aria-hidden="true"
          >
            <path d="m9 18 6-6-6-6" />
          </svg>
        </button>
      </div>
    </div>

    <button
      type="button"
      data-lightbox-close
      aria-label="Close lightbox"
      class="absolute top-4 right-4 rounded-full bg-white/10 p-2 text-white outline-none transition-colors hover:bg-white/20 focus-visible:ring-2 focus-visible:ring-white/60"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        class="size-4"
        aria-hidden="true"
      >
        <path d="M18 6 6 18M6 6l12 12" />
      </svg>
    </button>
  </dialog>
</div>
