<!-- DateRangePicker — requires Veil UI tokens and Tailwind v4. -->
<!-- Pair with date-range-picker.js for the two-month range calendar. -->
<div data-date-range-picker class="w-fit">
  <button
    type="button"
    popovertarget="date-range-picker-demo"
    aria-label="Choose date range"
    aria-haspopup="dialog"
    class="inline-flex h-9 w-72 items-center justify-start gap-2 rounded-md border border-input bg-background px-4 py-2 text-sm font-normal shadow-xs outline-none transition-colors hover:bg-accent hover:text-accent-foreground focus-visible:border-ring focus-visible:ring-[3px] focus-visible:ring-ring/50"
  >
    <svg class="size-4 opacity-60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <rect width="18" height="18" x="3" y="4" rx="2" />
      <path d="M16 2v4M8 2v4M3 10h18M17 14h-6M13 18H7M7 14h.01M17 18h.01" />
    </svg>
    <span data-range-label class="truncate text-muted-foreground">Pick a date range</span>
  </button>

  <div
    id="date-range-picker-demo"
    popover
    data-range-popover
    aria-label="Choose date range"
    class="m-0 w-auto rounded-md border bg-popover p-0 text-popover-foreground shadow-md opacity-0 scale-95 transition-[opacity,scale,display,overlay] [transition-behavior:allow-discrete] duration-150 open:opacity-100 open:scale-100 starting:open:opacity-0"
    style="position: fixed; inset: auto; top: 5rem; left: 2rem"
  >
    <div class="flex flex-col gap-4 p-3 sm:flex-row">
      <div class="flex w-full flex-col gap-2">
        <div class="relative flex h-8 items-center justify-center">
          <button
            type="button"
            data-range-prev
            aria-label="Go to the previous month"
            class="absolute left-0 inline-flex size-7 items-center justify-center rounded-md text-muted-foreground outline-none transition-colors hover:bg-accent hover:text-accent-foreground focus-visible:ring-2 focus-visible:ring-ring"
          >
            <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="m15 18-6-6 6-6" />
            </svg>
          </button>
          <span data-range-caption="0" class="text-sm font-medium"></span>
        </div>
        <div data-range-weekdays class="flex"></div>
        <div data-range-grid="0" role="grid" class="grid grid-cols-7 gap-1"></div>
      </div>

      <div class="flex w-full flex-col gap-2">
        <div class="relative flex h-8 items-center justify-center">
          <span data-range-caption="1" class="text-sm font-medium"></span>
          <button
            type="button"
            data-range-next
            aria-label="Go to the next month"
            class="absolute right-0 inline-flex size-7 items-center justify-center rounded-md text-muted-foreground outline-none transition-colors hover:bg-accent hover:text-accent-foreground focus-visible:ring-2 focus-visible:ring-ring"
          >
            <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="m9 18 6-6-6-6" />
            </svg>
          </button>
        </div>
        <div data-range-weekdays class="flex"></div>
        <div data-range-grid="1" role="grid" class="grid grid-cols-7 gap-1"></div>
      </div>
    </div>
  </div>
</div>
