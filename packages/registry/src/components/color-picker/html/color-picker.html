<!-- ColorPicker — requires Veil UI tokens and Tailwind v4. -->
<!-- Pair with color-picker.js to sync the native picker, hex field and swatches. -->
<div data-color-picker class="w-fit">
  <button
    type="button"
    popovertarget="color-picker-demo"
    aria-label="Choose color"
    aria-haspopup="dialog"
    class="inline-flex h-9 w-44 items-center justify-start gap-2 rounded-md border border-input bg-background px-4 py-2 text-sm font-normal shadow-xs outline-none transition-colors hover:bg-accent hover:text-accent-foreground focus-visible:border-ring focus-visible:ring-[3px] focus-visible:ring-ring/50"
  >
    <span
      data-color-trigger-swatch
      aria-hidden="true"
      class="size-4 rounded-sm border"
      style="background-color: #3b82f6"
    ></span>
    <span data-color-trigger-value class="uppercase tabular-nums">#3B82F6</span>
  </button>

  <div
    id="color-picker-demo"
    popover
    data-color-popover
    aria-label="Choose color"
    class="m-0 w-60 rounded-md border bg-popover p-3 text-popover-foreground shadow-md opacity-0 scale-95 transition-[opacity,scale,display,overlay] [transition-behavior:allow-discrete] duration-150 open:opacity-100 open:scale-100 starting:open:opacity-0"
    style="position: fixed; inset: auto; top: 5rem; left: 2rem"
  >
    <div class="flex items-center justify-between">
      <span class="text-sm font-medium">Choose color</span>
      <svg class="size-4 text-muted-foreground" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="m2 22 1-1h3l9-9M3 21v-3l9-9" />
        <path d="m15 6 3.4-3.4a2.1 2.1 0 1 1 3 3L18 9l.4.4a1 1 0 1 1-3 3l-3.8-3.8a1 1 0 1 1 3-3l.4.4Z" />
      </svg>
    </div>

    <input
      type="color"
      data-color-native
      aria-label="Choose color, native picker"
      value="#3b82f6"
      class="mt-3 h-9 w-full cursor-pointer rounded-md border border-input bg-transparent p-1"
    />

    <input
      type="text"
      data-color-hex
      aria-label="Choose color, hex value"
      value="#3B82F6"
      spellcheck="false"
      class="mt-3 h-9 w-full rounded-md border border-input bg-transparent px-3 font-mono text-sm uppercase outline-none focus-visible:border-ring focus-visible:ring-[3px] focus-visible:ring-ring/50"
    />

    <div role="group" aria-label="Preset colors" class="mt-3 grid grid-cols-5 gap-2">
      <button type="button" data-color-swatch="#000000" aria-label="Use #000000" aria-pressed="false" style="background-color: #000000" class="flex size-8 items-center justify-center rounded-md border outline-none transition-transform hover:scale-105 focus-visible:ring-2 focus-visible:ring-ring">
        <svg data-color-check class="hidden size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg>
      </button>
      <button type="button" data-color-swatch="#ffffff" aria-label="Use #ffffff" aria-pressed="false" style="background-color: #ffffff" class="flex size-8 items-center justify-center rounded-md border outline-none transition-transform hover:scale-105 focus-visible:ring-2 focus-visible:ring-ring">
        <svg data-color-check class="hidden size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg>
      </button>
      <button type="button" data-color-swatch="#ef4444" aria-label="Use #ef4444" aria-pressed="false" style="background-color: #ef4444" class="flex size-8 items-center justify-center rounded-md border outline-none transition-transform hover:scale-105 focus-visible:ring-2 focus-visible:ring-ring">
        <svg data-color-check class="hidden size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg>
      </button>
      <button type="button" data-color-swatch="#f97316" aria-label="Use #f97316" aria-pressed="false" style="background-color: #f97316" class="flex size-8 items-center justify-center rounded-md border outline-none transition-transform hover:scale-105 focus-visible:ring-2 focus-visible:ring-ring">
        <svg data-color-check class="hidden size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg>
      </button>
      <button type="button" data-color-swatch="#eab308" aria-label="Use #eab308" aria-pressed="false" style="background-color: #eab308" class="flex size-8 items-center justify-center rounded-md border outline-none transition-transform hover:scale-105 focus-visible:ring-2 focus-visible:ring-ring">
        <svg data-color-check class="hidden size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg>
      </button>
      <button type="button" data-color-swatch="#22c55e" aria-label="Use #22c55e" aria-pressed="false" style="background-color: #22c55e" class="flex size-8 items-center justify-center rounded-md border outline-none transition-transform hover:scale-105 focus-visible:ring-2 focus-visible:ring-ring">
        <svg data-color-check class="hidden size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg>
      </button>
      <button type="button" data-color-swatch="#06b6d4" aria-label="Use #06b6d4" aria-pressed="false" style="background-color: #06b6d4" class="flex size-8 items-center justify-center rounded-md border outline-none transition-transform hover:scale-105 focus-visible:ring-2 focus-visible:ring-ring">
        <svg data-color-check class="hidden size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg>
      </button>
      <button type="button" data-color-swatch="#3b82f6" aria-label="Use #3b82f6" aria-pressed="true" style="background-color: #3b82f6" class="flex size-8 items-center justify-center rounded-md border outline-none transition-transform hover:scale-105 focus-visible:ring-2 focus-visible:ring-ring">
        <svg data-color-check class="size-4 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg>
      </button>
      <button type="button" data-color-swatch="#8b5cf6" aria-label="Use #8b5cf6" aria-pressed="false" style="background-color: #8b5cf6" class="flex size-8 items-center justify-center rounded-md border outline-none transition-transform hover:scale-105 focus-visible:ring-2 focus-visible:ring-ring">
        <svg data-color-check class="hidden size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg>
      </button>
      <button type="button" data-color-swatch="#ec4899" aria-label="Use #ec4899" aria-pressed="false" style="background-color: #ec4899" class="flex size-8 items-center justify-center rounded-md border outline-none transition-transform hover:scale-105 focus-visible:ring-2 focus-visible:ring-ring">
        <svg data-color-check class="hidden size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg>
      </button>
    </div>
  </div>
</div>
