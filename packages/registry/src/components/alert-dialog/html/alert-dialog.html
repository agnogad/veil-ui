<!-- Alert dialog — native <dialog>, pair with alert-dialog.js. Requires Veil UI tokens and Tailwind v4. -->
<button
  type="button"
  data-dialog-open="delete-account-dialog"
  class="inline-flex h-9 items-center justify-center rounded-md bg-destructive px-4 text-sm font-medium text-destructive-foreground hover:bg-destructive/90 focus-visible:ring-[3px] focus-visible:ring-destructive/20"
>
  Delete account
</button>

<dialog
  id="delete-account-dialog"
  aria-labelledby="delete-account-title"
  aria-describedby="delete-account-description"
  class="w-[calc(100%-2rem)] max-w-md rounded-lg border bg-background p-6 text-foreground shadow-lg backdrop:bg-black/50"
>
  <form method="dialog" class="grid gap-4">
    <div class="flex flex-col gap-2">
      <h2 id="delete-account-title" class="text-lg font-semibold">Are you absolutely sure?</h2>
      <p id="delete-account-description" class="text-sm text-muted-foreground">
        This action cannot be undone. This will permanently delete your account
        and remove your data from our servers.
      </p>
    </div>
    <div class="flex flex-col-reverse gap-2 sm:flex-row sm:justify-end">
      <button
        value="cancel"
        formnovalidate
        class="inline-flex h-9 items-center justify-center rounded-md border border-input bg-background px-4 text-sm font-medium hover:bg-accent hover:text-accent-foreground focus-visible:ring-[3px] focus-visible:ring-ring/50"
      >
        Cancel
      </button>
      <button
        value="confirm"
        class="inline-flex h-9 items-center justify-center rounded-md bg-destructive px-4 text-sm font-medium text-destructive-foreground hover:bg-destructive/90 focus-visible:ring-[3px] focus-visible:ring-destructive/20"
      >
        Delete
      </button>
    </div>
  </form>
</dialog>
