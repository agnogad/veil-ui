<!-- Tab — requires Veil UI tokens and Tailwind v4. Pair with tab.js. -->
<div data-tab>
  <div
    role="tablist"
    aria-label="Account settings"
    class="inline-flex h-9 w-fit items-center justify-center rounded-lg bg-muted p-1 text-muted-foreground"
  >
    <button
      type="button"
      role="tab"
      id="tab-account"
      aria-controls="tab-panel-account"
      aria-selected="true"
      data-tab-target="tab-panel-account"
      data-active="true"
      class="inline-flex h-7 flex-1 items-center justify-center gap-1.5 whitespace-nowrap rounded-md px-3 text-sm font-medium outline-none transition-colors focus-visible:ring-[3px] focus-visible:ring-ring/50 data-[active=true]:bg-background data-[active=true]:text-foreground data-[active=true]:shadow-xs"
    >
      Account
    </button>
    <button
      type="button"
      role="tab"
      id="tab-billing"
      aria-controls="tab-panel-billing"
      aria-selected="false"
      data-tab-target="tab-panel-billing"
      data-active="false"
      tabindex="-1"
      class="inline-flex h-7 flex-1 items-center justify-center gap-1.5 whitespace-nowrap rounded-md px-3 text-sm font-medium outline-none transition-colors focus-visible:ring-[3px] focus-visible:ring-ring/50 data-[active=true]:bg-background data-[active=true]:text-foreground data-[active=true]:shadow-xs"
    >
      Billing
    </button>
  </div>

  <div
    role="tabpanel"
    id="tab-panel-account"
    aria-labelledby="tab-account"
    class="mt-3 rounded-lg border p-4 text-sm"
  >
    <p class="font-medium">Account</p>
    <p class="text-muted-foreground">Update your profile and email address.</p>
  </div>
  <div
    role="tabpanel"
    id="tab-panel-billing"
    aria-labelledby="tab-billing"
    class="mt-3 rounded-lg border p-4 text-sm"
    hidden
  >
    <p class="font-medium">Billing</p>
    <p class="text-muted-foreground">Manage payment methods and invoices.</p>
  </div>
</div>
