<!-- Tab Bar — requires Veil UI tokens and Tailwind v4. Pair with tab-bar.js. -->
<div data-tab-bar>
  <div
    role="tablist"
    aria-label="Project sections"
    class="inline-flex h-9 w-full items-center justify-center rounded-lg bg-muted p-1 text-muted-foreground"
  >
    <button
      type="button"
      role="tab"
      id="tab-bar-overview"
      aria-controls="tab-bar-panel-overview"
      aria-selected="true"
      data-tab-target="tab-bar-panel-overview"
      data-active="true"
      class="inline-flex h-7 flex-1 items-center justify-center gap-1.5 whitespace-nowrap rounded-md px-3 text-sm font-medium outline-none transition-colors focus-visible:ring-[3px] focus-visible:ring-ring/50 data-[active=true]:bg-background data-[active=true]:text-foreground data-[active=true]:shadow-xs"
    >
      Overview
    </button>
    <button
      type="button"
      role="tab"
      id="tab-bar-activity"
      aria-controls="tab-bar-panel-activity"
      aria-selected="false"
      data-tab-target="tab-bar-panel-activity"
      data-active="false"
      tabindex="-1"
      class="inline-flex h-7 flex-1 items-center justify-center gap-1.5 whitespace-nowrap rounded-md px-3 text-sm font-medium outline-none transition-colors focus-visible:ring-[3px] focus-visible:ring-ring/50 data-[active=true]:bg-background data-[active=true]:text-foreground data-[active=true]:shadow-xs"
    >
      Activity
    </button>
    <button
      type="button"
      role="tab"
      id="tab-bar-settings"
      aria-controls="tab-bar-panel-settings"
      aria-selected="false"
      data-tab-target="tab-bar-panel-settings"
      data-active="false"
      tabindex="-1"
      class="inline-flex h-7 flex-1 items-center justify-center gap-1.5 whitespace-nowrap rounded-md px-3 text-sm font-medium outline-none transition-colors focus-visible:ring-[3px] focus-visible:ring-ring/50 data-[active=true]:bg-background data-[active=true]:text-foreground data-[active=true]:shadow-xs"
    >
      Settings
    </button>
  </div>

  <div role="tabpanel" id="tab-bar-panel-overview" aria-labelledby="tab-bar-overview" class="mt-3 rounded-lg border p-3 text-sm">
    Project overview.
  </div>
  <div role="tabpanel" id="tab-bar-panel-activity" aria-labelledby="tab-bar-activity" class="mt-3 rounded-lg border p-3 text-sm" hidden>
    Recent activity.
  </div>
  <div role="tabpanel" id="tab-bar-panel-settings" aria-labelledby="tab-bar-settings" class="mt-3 rounded-lg border p-3 text-sm" hidden>
    Project settings.
  </div>
</div>
