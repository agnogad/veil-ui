<!-- Mobile FAB — requires Veil UI tokens and Tailwind v4. -->
<div class="relative h-44 w-full overflow-hidden rounded-lg border bg-muted/20">
  <p class="absolute left-4 top-4 text-sm text-muted-foreground">
    Thumb-friendly floating action
  </p>

  <button
    type="button"
    aria-label="Create item"
    data-slot="fab"
    data-position="bottom-right"
    class="absolute bottom-4 right-4 z-50 inline-flex size-12 items-center justify-center gap-2 rounded-full bg-primary text-primary-foreground shadow-lg outline-none transition-[color,background-color,box-shadow] hover:bg-primary/90 focus-visible:ring-[3px] focus-visible:ring-ring/50 disabled:pointer-events-none disabled:opacity-50 [&_svg]:size-5 [&_svg]:shrink-0"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M5 12h14M12 5v14" />
    </svg>
  </button>

  <button
    type="button"
    aria-label="New chat"
    data-slot="fab"
    data-position="bottom-right"
    class="absolute bottom-4 left-4 z-50 inline-flex h-12 items-center justify-center gap-2 rounded-full bg-primary px-5 text-sm font-medium text-primary-foreground shadow-lg outline-none transition-[color,background-color,box-shadow] hover:bg-primary/90 focus-visible:ring-[3px] focus-visible:ring-ring/50 disabled:pointer-events-none disabled:opacity-50 [&_svg]:size-5 [&_svg]:shrink-0"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M8 9h8M8 13h6" />
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
    </svg>
    <span>New chat</span>
  </button>
</div>
