<!-- Switch — native checkbox, no JavaScript. Requires Veil UI tokens and Tailwind v4. -->
<div class="grid gap-4">
  <label class="inline-flex cursor-pointer items-center gap-3 text-sm">
    <input type="checkbox" role="switch" class="peer sr-only" />
    <span
      class="relative inline-flex h-5 w-9 shrink-0 items-center rounded-full border border-transparent bg-input shadow-xs outline-none transition-colors peer-checked:bg-primary peer-focus-visible:ring-[3px] peer-focus-visible:ring-ring/50 peer-disabled:cursor-not-allowed peer-disabled:opacity-50 peer-checked:[&>span]:translate-x-4"
    >
      <span class="pointer-events-none block size-4 translate-x-0.5 rounded-full bg-background shadow-sm transition-transform"></span>
    </span>
    Product updates
  </label>

  <label class="inline-flex cursor-pointer items-center gap-3 text-sm">
    <input type="checkbox" role="switch" class="peer sr-only" checked />
    <span
      class="relative inline-flex h-5 w-9 shrink-0 items-center rounded-full border border-transparent bg-input shadow-xs outline-none transition-colors peer-checked:bg-primary peer-focus-visible:ring-[3px] peer-focus-visible:ring-ring/50 peer-disabled:cursor-not-allowed peer-disabled:opacity-50 peer-checked:[&>span]:translate-x-4"
    >
      <span class="pointer-events-none block size-4 translate-x-0.5 rounded-full bg-background shadow-sm transition-transform"></span>
    </span>
    Weekly digest
  </label>

  <label class="inline-flex cursor-pointer items-center gap-3 text-sm text-muted-foreground">
    <input type="checkbox" role="switch" class="peer sr-only" disabled />
    <span
      class="relative inline-flex h-5 w-9 shrink-0 items-center rounded-full border border-transparent bg-input shadow-xs outline-none transition-colors peer-checked:bg-primary peer-focus-visible:ring-[3px] peer-focus-visible:ring-ring/50 peer-disabled:cursor-not-allowed peer-disabled:opacity-50 peer-checked:[&>span]:translate-x-4"
    >
      <span class="pointer-events-none block size-4 translate-x-0.5 rounded-full bg-background shadow-sm transition-transform"></span>
    </span>
    Billing alerts (locked)
  </label>
</div>
