<!-- Calendar — requires Veil UI tokens, Tailwind v4 and the sibling calendar.js script. -->
<div class="flex flex-col gap-3">
  <div data-slot="calendar" class="w-fit p-3" aria-label="Calendar">
    <div class="relative flex h-8 items-center justify-center">
      <button type="button" data-calendar-prev aria-label="Go to the previous month" class="absolute left-0 inline-flex size-7 items-center justify-center rounded-md text-muted-foreground outline-none transition-colors hover:bg-accent hover:text-accent-foreground focus-visible:ring-2 focus-visible:ring-ring">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-4" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
      </button>
      <span data-calendar-label class="text-sm font-medium" role="status" aria-live="polite"></span>
      <button type="button" data-calendar-next aria-label="Go to the next month" class="absolute right-0 inline-flex size-7 items-center justify-center rounded-md text-muted-foreground outline-none transition-colors hover:bg-accent hover:text-accent-foreground focus-visible:ring-2 focus-visible:ring-ring">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-4" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
      </button>
    </div>
    <table role="grid" data-calendar-table class="mt-2 w-full border-collapse">
      <thead>
        <tr class="flex">
          <th scope="col" class="w-9 rounded-md text-[0.8rem] font-normal text-muted-foreground">Su</th>
          <th scope="col" class="w-9 rounded-md text-[0.8rem] font-normal text-muted-foreground">Mo</th>
          <th scope="col" class="w-9 rounded-md text-[0.8rem] font-normal text-muted-foreground">Tu</th>
          <th scope="col" class="w-9 rounded-md text-[0.8rem] font-normal text-muted-foreground">We</th>
          <th scope="col" class="w-9 rounded-md text-[0.8rem] font-normal text-muted-foreground">Th</th>
          <th scope="col" class="w-9 rounded-md text-[0.8rem] font-normal text-muted-foreground">Fr</th>
          <th scope="col" class="w-9 rounded-md text-[0.8rem] font-normal text-muted-foreground">Sa</th>
        </tr>
      </thead>
      <tbody class="mt-2 flex flex-col gap-1"></tbody>
    </table>
  </div>
  <p data-calendar-status class="text-sm text-muted-foreground"></p>
</div>
