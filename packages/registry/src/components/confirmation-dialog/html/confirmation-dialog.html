<!-- Confirmation Dialog — requires Veil UI tokens and Tailwind v4. -->
<div class="flex min-h-48 items-center justify-center p-6">
  <button
    type="button"
    data-confirmation-open
    class="inline-flex h-9 items-center justify-center rounded-md bg-destructive px-4 text-sm font-medium text-destructive-foreground outline-none transition-colors hover:bg-destructive/90 focus-visible:ring-[3px] focus-visible:ring-ring/50"
  >
    Delete project
  </button>

  <dialog
    id="confirmation-dialog"
    data-confirmation
    aria-labelledby="confirmation-title"
    aria-describedby="confirmation-description"
    class="m-auto w-[calc(100%-2rem)] max-w-md rounded-lg border bg-background p-6 text-foreground shadow-lg backdrop:bg-black/50"
  >
    <div class="grid gap-4">
      <div class="flex flex-col gap-2">
        <h2 id="confirmation-title" class="text-lg font-semibold">
          Delete this project?
        </h2>
        <p id="confirmation-description" class="text-sm text-muted-foreground">
          All files, deployments and environment variables will be permanently
          removed.
        </p>
      </div>

      <div class="flex flex-col-reverse gap-2 sm:flex-row sm:justify-end">
        <button
          type="button"
          data-confirmation-cancel
          class="inline-flex h-9 items-center justify-center rounded-md border border-input bg-background px-4 text-sm font-medium transition-colors hover:bg-accent hover:text-accent-foreground"
        >
          Cancel
        </button>
        <button
          type="button"
          data-confirmation-confirm
          class="inline-flex h-9 items-center justify-center rounded-md bg-destructive px-4 text-sm font-medium text-destructive-foreground transition-colors hover:bg-destructive/90"
        >
          Delete project
        </button>
      </div>
    </div>
  </dialog>
</div>
