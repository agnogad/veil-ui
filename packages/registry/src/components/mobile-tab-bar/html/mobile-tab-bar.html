<!-- Mobile Tab Bar — requires Veil UI tokens and Tailwind v4. Pair with mobile-tab-bar.js. -->
<div data-mobile-tab-bar class="mx-auto w-full max-w-sm overflow-hidden rounded-lg border">
  <div role="tabpanel" id="mobile-tab-home" aria-labelledby="mobile-tab-home-trigger" class="p-4 text-sm">
    Home feed
  </div>
  <div role="tabpanel" id="mobile-tab-alerts" aria-labelledby="mobile-tab-alerts-trigger" class="p-4 text-sm" hidden>
    Alerts
  </div>
  <div role="tabpanel" id="mobile-tab-profile" aria-labelledby="mobile-tab-profile-trigger" class="p-4 text-sm" hidden>
    Profile
  </div>

  <div
    role="tablist"
    aria-label="Sections"
    class="grid h-14 grid-cols-3 border-t bg-background"
  >
    <button
      type="button"
      role="tab"
      id="mobile-tab-home-trigger"
      aria-controls="mobile-tab-home"
      aria-selected="true"
      data-tab-target="mobile-tab-home"
      data-active="true"
      class="inline-flex flex-col items-center justify-center gap-1 text-[10px] font-medium text-muted-foreground transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring data-[active=true]:text-foreground"
    >
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-4" aria-hidden="true">
        <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
        <polyline points="9 22 9 12 15 12 15 22" />
      </svg>
      Home
    </button>
    <button
      type="button"
      role="tab"
      id="mobile-tab-alerts-trigger"
      aria-controls="mobile-tab-alerts"
      aria-selected="false"
      data-tab-target="mobile-tab-alerts"
      data-active="false"
      tabindex="-1"
      class="inline-flex flex-col items-center justify-center gap-1 text-[10px] font-medium text-muted-foreground transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring data-[active=true]:text-foreground"
    >
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-4" aria-hidden="true">
        <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" />
        <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" />
      </svg>
      Alerts
    </button>
    <button
      type="button"
      role="tab"
      id="mobile-tab-profile-trigger"
      aria-controls="mobile-tab-profile"
      aria-selected="false"
      data-tab-target="mobile-tab-profile"
      data-active="false"
      tabindex="-1"
      class="inline-flex flex-col items-center justify-center gap-1 text-[10px] font-medium text-muted-foreground transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring data-[active=true]:text-foreground"
    >
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-4" aria-hidden="true">
        <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
        <circle cx="12" cy="7" r="4" />
      </svg>
      Profile
    </button>
  </div>
</div>
