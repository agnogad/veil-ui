<!-- Form Repeater — requires Veil UI tokens and Tailwind v4. Pair with form-repeater.js. -->
<div data-slot="form-repeater" data-form-repeater data-min="1" data-max="3" class="flex max-w-xl flex-col gap-3">
  <div data-repeater-rows class="flex flex-col gap-3">
    <div data-repeater-row class="rounded-lg border bg-card p-3 text-card-foreground">
      <div class="mb-3 flex items-center justify-between gap-2">
        <span data-row-label class="text-xs font-medium text-muted-foreground">Row 1</span>
        <button
          type="button"
          data-remove-row
          aria-label="Remove row"
          class="inline-flex size-7 items-center justify-center rounded-md text-sm transition-colors hover:bg-accent hover:text-accent-foreground disabled:pointer-events-none disabled:opacity-50"
        >
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-4" aria-hidden="true"><path d="M3 6h18" /><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" /><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" /><line x1="10" x2="10" y1="11" y2="17" /><line x1="14" x2="14" y1="11" y2="17" /></svg>
        </button>
      </div>
      <div class="grid gap-3 sm:grid-cols-2">
        <label class="flex flex-col gap-1 text-xs font-medium text-muted-foreground">
          <span>Name</span>
          <input
            type="text"
            placeholder="Ada Lovelace"
            aria-label="Name row 1"
            class="h-9 w-full min-w-0 rounded-md border border-input bg-transparent px-3 py-1 text-sm shadow-xs outline-none transition-[color,box-shadow,border-color] placeholder:text-muted-foreground focus-visible:border-ring focus-visible:ring-[3px] focus-visible:ring-ring/50 dark:bg-input/30"
          />
        </label>
        <label class="flex flex-col gap-1 text-xs font-medium text-muted-foreground">
          <span>Email</span>
          <input
            type="email"
            placeholder="ada@example.com"
            aria-label="Email row 1"
            class="h-9 w-full min-w-0 rounded-md border border-input bg-transparent px-3 py-1 text-sm shadow-xs outline-none transition-[color,box-shadow,border-color] placeholder:text-muted-foreground focus-visible:border-ring focus-visible:ring-[3px] focus-visible:ring-ring/50 dark:bg-input/30"
          />
        </label>
      </div>
    </div>
  </div>
  <button
    type="button"
    data-repeater-add
    class="inline-flex h-9 w-fit items-center justify-center gap-2 rounded-md border border-input bg-background px-4 text-sm font-medium transition-colors hover:bg-accent hover:text-accent-foreground disabled:pointer-events-none disabled:opacity-50"
  >
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-4" aria-hidden="true"><path d="M5 12h14" /><path d="M12 5v14" /></svg>
    Add contact
  </button>
</div>
