<!-- Popover — native popover API, no JavaScript. Requires Veil UI tokens and Tailwind v4. -->
<button
  type="button"
  popovertarget="popover-demo"
  class="inline-flex h-9 items-center justify-center rounded-md border border-input bg-background px-4 text-sm font-medium hover:bg-accent hover:text-accent-foreground focus-visible:ring-[3px] focus-visible:ring-ring/50"
>
  Open popover
</button>

<div
  id="popover-demo"
  popover
  class="m-0 mt-2 w-72 origin-top rounded-md border bg-popover p-4 text-popover-foreground shadow-md opacity-0 scale-95 transition-[opacity,scale,display,overlay] [transition-behavior:allow-discrete] duration-150 open:opacity-100 open:scale-100 starting:open:opacity-0"
  style="position: fixed; inset: auto; top: 4.5rem; left: 50%; translate: -50% 0"
>
  <div class="grid gap-2">
    <p class="text-sm font-medium">Dimensions</p>
    <p class="text-sm text-muted-foreground">
      Set the dimensions for the layer. Values are in pixels.
    </p>
    <label class="mt-2 grid gap-1 text-xs text-muted-foreground">
      Width
      <input
        type="number"
        value="320"
        class="h-8 rounded-md border border-input bg-transparent px-2 text-sm text-foreground outline-none focus-visible:ring-[3px] focus-visible:ring-ring/50"
      />
    </label>
    <button
      type="button"
      popovertarget="popover-demo"
      popovertargetaction="hide"
      class="mt-2 inline-flex h-8 items-center justify-center rounded-md bg-primary px-3 text-xs font-medium text-primary-foreground hover:bg-primary/90"
    >
      Close
    </button>
  </div>
</div>
