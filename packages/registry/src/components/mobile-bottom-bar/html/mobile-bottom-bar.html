<!-- Mobile Bottom Bar — requires Veil UI tokens and Tailwind v4. -->
<div class="mx-auto w-full max-w-sm overflow-hidden rounded-lg border">
  <div class="flex items-center justify-between gap-4 p-4">
    <div>
      <p class="text-xs text-muted-foreground">Total</p>
      <p class="text-sm font-semibold">$129.00</p>
    </div>
    <p class="text-xs text-muted-foreground">Shipping calculated at checkout</p>
  </div>

  <div

      class="inline-flex h-9 flex-1 items-center justify-center rounded-md border border-input bg-background px-4 text-sm font-medium transition-colors hover:bg-accent hover:text-accent-foreground"

      Cancel

      type="button"
      class="inline-flex h-9 flex-1 items-center justify-center rounded-md bg-primary px-4 text-sm font-medium text-primary-foreground transition-colors hover:bg-primary/90"
    >
      Checkout
    </button>
