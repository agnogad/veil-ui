<!-- Tooltip — CSS only, no JavaScript. Requires Veil UI tokens and Tailwind v4. -->
<div class="flex flex-wrap items-center gap-6">
  <span class="group relative inline-flex">
    <button
      type="button"
      class="inline-flex h-9 items-center justify-center rounded-md border border-input bg-background px-4 text-sm font-medium hover:bg-accent hover:text-accent-foreground focus-visible:ring-[3px] focus-visible:ring-ring/50"
      aria-describedby="tooltip-demo"
    >
      Hover or focus me
    </button>
    <span
      id="tooltip-demo"
      role="tooltip"
      class="pointer-events-none absolute bottom-full left-1/2 z-50 mb-2 w-max max-w-xs -translate-x-1/2 rounded-md bg-foreground px-2.5 py-1.5 text-xs text-background opacity-0 shadow-md transition-opacity group-hover:opacity-100 group-focus-within:opacity-100"
    >
      Add to your library
    </span>
  </span>

  <span class="group relative inline-flex">
    <button
      type="button"
      aria-label="More information"
      class="inline-flex size-9 items-center justify-center rounded-md border border-input bg-background hover:bg-accent hover:text-accent-foreground focus-visible:ring-[3px] focus-visible:ring-ring/50"
      aria-describedby="tooltip-icon"
    >
      <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="12" cy="12" r="10" />
        <path d="M12 16v-4M12 8h.01" />
      </svg>
    </button>
    <span
      id="tooltip-icon"
      role="tooltip"
      class="pointer-events-none absolute bottom-full left-1/2 z-50 mb-2 w-max -translate-x-1/2 rounded-md bg-foreground px-2.5 py-1.5 text-xs text-background opacity-0 shadow-md transition-opacity group-hover:opacity-100 group-focus-within:opacity-100"
    >
      Keyboard shortcuts
    </span>
  </span>
</div>
