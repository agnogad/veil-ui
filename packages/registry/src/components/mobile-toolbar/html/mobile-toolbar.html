<!-- Mobile Toolbar — requires Veil UI tokens and Tailwind v4. Pair with mobile-toolbar.js. -->
<div class="mx-auto w-full max-w-sm overflow-hidden rounded-lg border">
  <div
    data-mobile-toolbar
    data-slot="mobile-toolbar"
    role="toolbar"
    aria-label="List tools"
    class="flex w-full items-center gap-1 overflow-x-auto border-y bg-background px-2 py-1.5 [scrollbar-width:none]"
  >
    <button
      type="button"
      data-toolbar-item
      aria-pressed="true"
      data-active="true"
      class="relative inline-flex shrink-0 items-center gap-1.5 rounded-md px-2.5 py-1.5 text-xs font-medium text-muted-foreground outline-none transition-colors hover:bg-accent hover:text-accent-foreground focus-visible:ring-2 focus-visible:ring-ring data-[active=true]:bg-primary data-[active=true]:text-primary-foreground"
    >

      <span>Filter</span>

    <button
      type="button"

      aria-pressed="false"
      data-active="false"
      class="relative inline-flex shrink-0 items-center gap-1.5 rounded-md px-2.5 py-1.5 text-xs font-medium text-muted-foreground outline-none transition-colors hover:bg-accent hover:text-accent-foreground focus-visible:ring-2 focus-visible:ring-ring data-[active=true]:bg-primary data-[active=true]:text-primary-foreground"

      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-3.5" aria-hidden="true">

      <span>Sort</span>
    </button>
    <button
      type="button"
      data-toolbar-item
      aria-pressed="false"
      data-active="false"
      class="relative inline-flex shrink-0 items-center gap-1.5 rounded-md px-2.5 py-1.5 text-xs font-medium text-muted-foreground outline-none transition-colors hover:bg-accent hover:text-accent-foreground focus-visible:ring-2 focus-visible:ring-ring data-[active=true]:bg-primary data-[active=true]:text-primary-foreground"
