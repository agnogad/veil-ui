<!-- Gauge chart — requires Veil UI tokens and Tailwind v4. -->
<figure class="flex w-full max-w-xs flex-col items-center">
  <svg
    role="img"
    aria-label="CPU load: 68 of 100 (68%)"
    viewBox="0 0 200 120"
    style="height: 140px"
    class="w-full"
  >
    <path
      d="M 20 100 A 80 80 0 0 1 180 100"
      pathLength="100"
      fill="none"
      stroke="var(--muted)"
      stroke-width="14"
      stroke-linecap="round"
    />
    <path
      d="M 20 100 A 80 80 0 0 1 180 100"
      pathLength="100"
      fill="none"
      stroke="var(--primary)"
      stroke-width="14"
      stroke-linecap="round"
      stroke-dasharray="68 100"
      class="transition-all duration-500"
    />
    <text x="100" y="82" text-anchor="middle" class="fill-foreground text-2xl font-semibold" style="fill: currentColor">68%</text>
    <text x="100" y="104" text-anchor="middle" class="fill-muted-foreground text-[11px]" style="fill: currentColor">CPU load</text>
  </svg>
  <figcaption class="text-xs text-muted-foreground">68 of 100</figcaption>
</figure>
