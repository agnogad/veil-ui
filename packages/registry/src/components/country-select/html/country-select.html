<!-- CountrySelect — requires Veil UI tokens and Tailwind v4. -->
<!-- Native <select> with flag labels and dial codes, no JavaScript. -->
<div data-slot="country-select" class="relative inline-flex w-60 items-center">
  <select
    aria-label="Country"
    class="h-9 w-full appearance-none rounded-md border border-input bg-background py-2 pl-3 pr-9 text-sm shadow-xs outline-none transition-[color,background-color,border-color,box-shadow] hover:bg-accent hover:text-accent-foreground focus-visible:border-ring focus-visible:ring-[3px] focus-visible:ring-ring/50 disabled:cursor-not-allowed disabled:opacity-50"
  >
    <option value="" disabled>Select a country</option>
    <option value="US">🇺🇸 United States (+1)</option>
    <option value="GB">🇬🇧 United Kingdom (+44)</option>
    <option value="TR" selected>🇹🇷 Turkey (+90)</option>
    <option value="DE">🇩🇪 Germany (+49)</option>
    <option value="FR">🇫🇷 France (+33)</option>
    <option value="NL">🇳🇱 Netherlands (+31)</option>
    <option value="ES">🇪🇸 Spain (+34)</option>
    <option value="IT">🇮🇹 Italy (+39)</option>
    <option value="PT">🇵🇹 Portugal (+351)</option>
    <option value="BR">🇧🇷 Brazil (+55)</option>
    <option value="JP">🇯🇵 Japan (+81)</option>
    <option value="KR">🇰🇷 South Korea (+82)</option>
    <option value="IN">🇮🇳 India (+91)</option>
    <option value="AU">🇦🇺 Australia (+61)</option>
    <option value="CA">🇨🇦 Canada (+1)</option>
    <option value="ZA">🇿🇦 South Africa (+27)</option>
    <option value="AE">🇦🇪 United Arab Emirates (+971)</option>
    <option value="SG">🇸🇬 Singapore (+65)</option>
  </select>
  <svg
    class="pointer-events-none absolute right-3 size-4 shrink-0 opacity-50"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    aria-hidden="true"
  >
    <path d="m7 15 5 5 5-5M7 9l5-5 5 5" />
  </svg>
</div>
