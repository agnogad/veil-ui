<!-- Password input — pair with password-input.js. Requires Veil UI tokens and Tailwind v4. -->
<div class="grid w-full max-w-sm gap-1.5">
  <label for="password" class="text-sm font-medium leading-none">Password</label>
  <div class="relative w-full" data-password-input>
    <input
      id="password"
      type="password"
      placeholder="At least 12 characters"
      autocomplete="new-password"
      class="h-9 w-full min-w-0 rounded-md border border-input bg-transparent px-3 py-1 pr-10 text-sm shadow-xs outline-none transition-[color,box-shadow,border-color] selection:bg-primary selection:text-primary-foreground placeholder:text-muted-foreground focus-visible:border-ring focus-visible:ring-[3px] focus-visible:ring-ring/50 disabled:cursor-not-allowed disabled:opacity-50"
    />
    <button
      type="button"
      data-password-toggle
      aria-label="Show password"
      aria-pressed="false"
      class="absolute right-1 top-1/2 inline-flex size-7 -translate-y-1/2 items-center justify-center rounded-md text-muted-foreground outline-none transition-colors hover:text-foreground focus-visible:ring-[3px] focus-visible:ring-ring/50"
    >
      <svg data-icon-show class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M2.06 12.35a1 1 0 0 1 0-.7C3.66 7.9 7.5 5 12 5s8.34 2.9 9.94 6.65a1 1 0 0 1 0 .7C20.34 16.1 16.5 19 12 19s-8.34-2.9-9.94-6.65" />
        <circle cx="12" cy="12" r="3" />
      </svg>
      <svg data-icon-hide class="hidden size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c4.5 0 8.34 2.9 9.94 6.65a1 1 0 0 1 0 .7 11.8 11.8 0 0 1-2.2 3.19M6.61 6.61A11.8 11.8 0 0 0 2.06 11.65a1 1 0 0 0 0 .7C3.66 16.1 7.5 19 12 19a10.4 10.4 0 0 0 5.39-1.61M2 2l20 20M9.88 9.88a3 3 0 1 0 4.24 4.24" />
      </svg>
    </button>
  </div>
  <p class="text-sm text-muted-foreground">
    Use a mix of letters, numbers and symbols.
  </p>
</div>
