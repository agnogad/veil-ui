<!-- Tabs — pair with tabs.js. Requires Veil UI tokens and Tailwind v4. -->
<div data-tabs>
  <div
    role="tablist"
    aria-label="Account settings"
    class="inline-flex h-9 w-fit items-center justify-center rounded-lg bg-muted p-1 text-muted-foreground"
  >
    <button
      type="button"
      role="tab"
      id="tab-account"
      aria-controls="panel-account"
      aria-selected="true"
      data-tab-target="panel-account"
      data-active="true"
      class="inline-flex h-7 flex-1 items-center justify-center gap-1.5 whitespace-nowrap rounded-md px-3 text-sm font-medium outline-none transition-colors focus-visible:ring-[3px] focus-visible:ring-ring/50 data-[active=true]:bg-background data-[active=true]:text-foreground data-[active=true]:shadow-xs"
    >
      Account
    </button>
    <button
      type="button"
      role="tab"
      id="tab-password"
      aria-controls="panel-password"
      aria-selected="false"
      data-tab-target="panel-password"
      data-active="false"
      tabindex="-1"
      class="inline-flex h-7 flex-1 items-center justify-center gap-1.5 whitespace-nowrap rounded-md px-3 text-sm font-medium outline-none transition-colors focus-visible:ring-[3px] focus-visible:ring-ring/50 data-[active=true]:bg-background data-[active=true]:text-foreground data-[active=true]:shadow-xs"
    >
      Password
    </button>
    <button
      type="button"
      role="tab"
      id="tab-notifications"
      aria-controls="panel-notifications"
      aria-selected="false"
      data-tab-target="panel-notifications"
      data-active="false"
      tabindex="-1"
      class="inline-flex h-7 flex-1 items-center justify-center gap-1.5 whitespace-nowrap rounded-md px-3 text-sm font-medium outline-none transition-colors focus-visible:ring-[3px] focus-visible:ring-ring/50 data-[active=true]:bg-background data-[active=true]:text-foreground data-[active=true]:shadow-xs"
    >
      Notifications
    </button>
  </div>

  <div role="tabpanel" id="panel-account" aria-labelledby="tab-account" class="mt-3 rounded-lg border p-4 text-sm">
    <p class="font-medium">Account</p>
    <p class="text-muted-foreground">Update your display name and public profile.</p>
  </div>
  <div role="tabpanel" id="panel-password" aria-labelledby="tab-password" class="mt-3 rounded-lg border p-4 text-sm" hidden>
    <p class="font-medium">Password</p>
    <p class="text-muted-foreground">Choose a strong password you have not used before.</p>
  </div>
  <div role="tabpanel" id="panel-notifications" aria-labelledby="tab-notifications" class="mt-3 rounded-lg border p-4 text-sm" hidden>
    <p class="font-medium">Notifications</p>
    <p class="text-muted-foreground">Pick which events should send you an email.</p>
  </div>
</div>
