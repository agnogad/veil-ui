<!-- Hover Card — requires Veil UI tokens and Tailwind v4. -->
<div class="group relative inline-block">
  <button
    type="button"
    class="inline-flex h-9 items-center justify-center rounded-md px-3 text-sm font-medium text-primary underline-offset-4 hover:underline focus-visible:outline-none focus-visible:ring-[3px] focus-visible:ring-ring/50"
  >
    @ada
  </button>

  <div
    role="dialog"
    aria-label="Profile preview"
    class="pointer-events-none invisible absolute left-0 top-full z-50 mt-2 w-64 origin-top-left translate-y-1 scale-95 rounded-md border bg-popover p-4 text-popover-foreground opacity-0 shadow-md outline-none transition-[opacity,scale,translate,visibility] duration-150 ease-out group-focus-within:pointer-events-auto group-focus-within:visible group-focus-within:translate-y-0 group-focus-within:scale-100 group-focus-within:opacity-100 group-hover:pointer-events-auto group-hover:visible group-hover:translate-y-0 group-hover:scale-100 group-hover:opacity-100"
  >
    <div class="flex gap-3">
      <div class="flex size-10 shrink-0 items-center justify-center rounded-full bg-secondary text-sm font-semibold">
        AL
      </div>
      <div class="flex flex-col gap-1">
        <p class="text-sm font-semibold">Ada Lovelace</p>
        <p class="text-xs text-muted-foreground">@ada</p>
        <p class="text-sm">Writes about design systems and leaps of logic.</p>
      </div>
    </div>
  </div>
</div>
