<!-- Chart Tooltip — requires Veil UI tokens and Tailwind v4. -->
<div class="grid w-fit min-w-32 gap-1.5 rounded-md border bg-popover px-2.5 py-2 text-xs text-popover-foreground shadow-md">
  <p class="font-medium">Wednesday</p>
  <div class="flex items-center gap-2">
    <span class="size-2 shrink-0 rounded-[2px]" style="background-color: var(--chart-1)" aria-hidden="true"></span>
    <span class="text-muted-foreground">Desktop</span>
    <span class="ml-auto font-medium tabular-nums">1,204</span>
  </div>
  <div class="flex items-center gap-2">
    <span class="size-2 shrink-0 rounded-[2px]" style="background-color: var(--chart-2)" aria-hidden="true"></span>
    <span class="text-muted-foreground">Mobile</span>
    <span class="ml-auto font-medium tabular-nums">864</span>
  </div>
</div>
