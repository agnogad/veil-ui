<!-- Scroll Area — requires Veil UI tokens and Tailwind v4. -->
<div class="relative h-48 w-full max-w-sm overflow-hidden rounded-md border">
  <div
    class="size-full rounded-[inherit] outline-none transition-[color,box-shadow] focus-visible:ring-[3px] focus-visible:ring-ring/50 [scrollbar-color:var(--border)_transparent] [scrollbar-width:thin] [&::-webkit-scrollbar]:w-2.5 [&::-webkit-scrollbar-thumb]:rounded-full [&::-webkit-scrollbar-thumb]:bg-border [&::-webkit-scrollbar-track]:bg-transparent"
    tabindex="0"
    role="region"
    aria-label="Scrollable content"
  >
    <div class="grid gap-2 p-3">
      <div class="rounded-md border bg-muted/20 px-3 py-2 text-sm">Row 1</div>
      <div class="rounded-md border bg-muted/20 px-3 py-2 text-sm">Row 2</div>
      <div class="rounded-md border bg-muted/20 px-3 py-2 text-sm">Row 3</div>
      <div class="rounded-md border bg-muted/20 px-3 py-2 text-sm">Row 4</div>
      <div class="rounded-md border bg-muted/20 px-3 py-2 text-sm">Row 5</div>
      <div class="rounded-md border bg-muted/20 px-3 py-2 text-sm">Row 6</div>
      <div class="rounded-md border bg-muted/20 px-3 py-2 text-sm">Row 7</div>
      <div class="rounded-md border bg-muted/20 px-3 py-2 text-sm">Row 8</div>
      <div class="rounded-md border bg-muted/20 px-3 py-2 text-sm">Row 9</div>
      <div class="rounded-md border bg-muted/20 px-3 py-2 text-sm">Row 10</div>
      <div class="rounded-md border bg-muted/20 px-3 py-2 text-sm">Row 11</div>
      <div class="rounded-md border bg-muted/20 px-3 py-2 text-sm">Row 12</div>
    </div>
  </div>
</div>
