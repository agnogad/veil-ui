<!-- Mobile Page Indicator — requires Veil UI tokens and Tailwind v4. Pair with mobile-page-indicator.js. -->
<div class="mx-auto w-full max-w-sm rounded-lg border bg-muted/20 p-6">
  <div data-page-label class="grid h-24 place-items-center text-sm text-muted-foreground">
    Slide 1
  </div>
  <div
    data-mobile-page-indicator
    data-slot="mobile-page-indicator"
    role="group"
    aria-label="Pages"
    class="mt-4 flex items-center justify-center gap-1.5"
  >
    <button
      type="button"
      data-page-indicator-dot
      data-index="0"
      aria-label="Go to page 1"
      aria-current="true"
      data-active="true"
      class="h-1.5 w-1.5 rounded-full bg-muted-foreground/30 outline-none transition-all focus-visible:ring-2 focus-visible:ring-ring data-[active=true]:w-5 data-[active=true]:bg-primary"
    >
      <span class="sr-only">Page 1</span>
    </button>
    <button
      type="button"
      data-page-indicator-dot
      data-index="1"
      aria-label="Go to page 2"
      data-active="false"
      class="h-1.5 w-1.5 rounded-full bg-muted-foreground/30 outline-none transition-all focus-visible:ring-2 focus-visible:ring-ring data-[active=true]:w-5 data-[active=true]:bg-primary"
    >
      <span class="sr-only">Page 2</span>
    </button>
    <button
      type="button"
      data-page-indicator-dot
      data-index="2"
      aria-label="Go to page 3"
      data-active="false"
      class="h-1.5 w-1.5 rounded-full bg-muted-foreground/30 outline-none transition-all focus-visible:ring-2 focus-visible:ring-ring data-[active=true]:w-5 data-[active=true]:bg-primary"
    >
      <span class="sr-only">Page 3</span>
    </button>
    <span data-page-status class="sr-only">Page 1 of 3</span>
  </div>
</div>
