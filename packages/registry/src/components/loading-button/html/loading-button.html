<!-- Loading Button — requires Veil UI tokens and Tailwind v4. -->
<!-- Pair with loading-button.js to simulate a busy request. -->
<button
  type="button"
  data-loading-button
  class="inline-flex h-9 shrink-0 items-center justify-center gap-2 whitespace-nowrap rounded-md bg-primary px-4 py-2 text-sm font-medium text-primary-foreground outline-none transition-colors hover:bg-primary/90 focus-visible:border-ring focus-visible:ring-[3px] focus-visible:ring-ring/50 disabled:pointer-events-none disabled:opacity-50"
>
  <svg data-loading-spinner hidden class="size-4 animate-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
    <path d="M21 12a9 9 0 1 1-6.219-8.56" />
  </svg>
  <span data-loading-label>Save changes</span>
</button>
